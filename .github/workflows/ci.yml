name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # No Ollama on hosted runners -- these suites use PROVIDER=mock or
      # need no LLM at all, so CI proves the logic (parsing, gate structure,
      # MCP protocol wiring, orchestrator decision-making) on every push.
      # Judgment QUALITY against a real model is validated separately, by
      # hand, against Ollama -- see README for what that run showed.
      - name: Tool smoke tests
        run: python3 tests/test_tools_smoke.py

      - name: Decision policy tests
        run: python3 tests/test_decision_policy.py

      - name: MCP protocol tests
        run: python3 tests/test_mcp_servers.py

      - name: Orchestrator verdict tests
        run: python3 tests/test_orchestrator_verdict.py

      - name: Gemini provider tests (offline, no API key)
        run: python3 tests/test_gemini_provider.py

      - name: Run-level drift tests (real recorded baseline, no LLM)
        run: python3 tests/test_run_eval.py

      - name: Judge measurement tests (recorded measurement, no LLM)
        run: python3 tests/test_measure_judge.py

      - name: Prompt-injection tests (rule-based check, recorded measurement, no LLM)
        run: python3 tests/test_injection.py

      - name: Agreement with human labels (recorded results, no LLM)
        run: python3 tests/test_agreement.py
